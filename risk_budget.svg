<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450"><rect width="100%" height="100%" fill="#0b1220"/><g font-family="Arial,sans-serif" fill="#edf3fc"><text x="40" y="45" font-size="26" font-weight="bold">The risk budget</text><text x="40" y="73" font-size="14" fill="#9cacc5">At 40 yards to goal, 4th &amp; 3 | Mean value and probability of a negative outcome</text><text x="40" y="140" font-size="20" fill="#2dd4bf">GO</text><rect x="170" y="115" width="265.7" height="30" fill="#2dd4bf" rx="5"/><text x="445.72404012187513" y="140" font-size="14" fill="#edf3fc">+1.66 value</text><text x="640" y="140" font-size="20" fill="#edf3fc">42.8% negative outcome</text><text x="40" y="230" font-size="20" fill="#fbbf24">KICK</text><rect x="170" y="205" width="92.8" height="30" fill="#fbbf24" rx="5"/><text x="272.78853849077694" y="230" font-size="14" fill="#edf3fc">+0.58 value</text><text x="640" y="230" font-size="20" fill="#edf3fc">57.1% negative outcome</text><text x="40" y="320" font-size="20" fill="#a78bfa">PUNT</text><rect x="170" y="295" width="0.0" height="30" fill="#a78bfa" rx="5"/><text x="180" y="320" font-size="14" fill="#edf3fc">-0.02 value</text><text x="640" y="320" font-size="20" fill="#edf3fc">100.0% negative outcome</text><text x="40" y="410" font-size="14" fill="#edf3fc">PUNT is deterministic in this toy model; its 100% negative rate means a tiny -0.02 value.</text></g></svg>